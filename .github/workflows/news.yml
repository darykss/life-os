# Met à jour news.json chaque matin (03h15 UTC, soit 04h15 ou 05h15 à Paris selon la saison).
# À placer dans le dépôt GitHub à cet emplacement exact : .github/workflows/news.yml
name: Actualités du jour

on:
  schedule:
    - cron: '15 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lire les flux RSS
        run: python3 fetch-news.py
      - name: Enregistrer news.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json
          git diff --cached --quiet || git commit -m "Actualités du jour"
          git push
